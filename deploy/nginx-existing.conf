# Dedicated vhost for a host that already runs Nginx. Other sites are untouched.
server {
    listen 80;
    listen [::]:80;
    server_name tingjian.rainflowtb.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tingjian-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tingjian.rainflowtb.cn;
    ssl_certificate /etc/letsencrypt/live/tingjian.rainflowtb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tingjian.rainflowtb.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 17m;
    location ^~ /api/mini/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_buffering off;
    }
    location = / {
        default_type application/json;
        return 200 '{"service":"tingjian","client":"wechat-miniprogram"}';
    }
    location / { return 404; }
}
